<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marrow Sea</title>
<style>
  html, body { margin: 0; height: 100%; background: #10222c; overflow: hidden; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #debug-panel {
    position: fixed;
    top: 12px;
    left: 12px;
    background: rgba(20, 30, 34, 0.85);
    border: 1px solid #3a5a63;
    border-radius: 6px;
    padding: 10px 14px;
    color: #dce8ea;
    font: 13px 'Segoe UI', sans-serif;
    z-index: 10;
  }
  .debug-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .debug-row label { width: 100px; flex-shrink: 0; }
  .debug-control { display: flex; align-items: center; gap: 6px; }
  .debug-control span { width: 18px; text-align: right; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="debug-panel"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
